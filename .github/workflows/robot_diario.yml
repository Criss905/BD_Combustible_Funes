name: Robot Diario Funes

on:
  schedule:
    - cron: '30 20 * * *' # 3:30 PM Hora de Colombia
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

jobs:
  auditoria_funes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Inyectar Credenciales GCP de forma segura
        run: printf '%s' "$GCP_CREDENTIALS" > credenciales.json
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}

      - name: Ejecutar Orquestador Maestro
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          REMITENTE_ESTACION: ${{ secrets.REMITENTE_ESTACION }}
          ID_GOOGLE_SHEET: ${{ secrets.ID_GOOGLE_SHEET }}
        run: python robot_maestro.py